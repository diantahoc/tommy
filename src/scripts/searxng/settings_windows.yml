# Minimal Windows override for a local, single-user SearXNG that exposes the JSON
# API to Tommy. Inherits everything from the packaged searx/settings.yml, then
# changes only what matters. Replace the secret_key placeholder (setup.ps1 does
# this for you; Tommy also fills it on install if it is still the placeholder).
#
# Rate limiter: Mode A — OFF. This is a loopback-only, single-user backend; the
# limiter's bot-detection rejects our own JSON requests (local requests carry no
# X-Forwarded-For / X-Real-IP header, so the limiter errors and blocks them), and
# there is nobody to rate-limit. For Mode B (SearXNG's limiter over an in-memory
# fakeredis store) set limiter: true and uncomment valkey.url below.
use_default_settings: true

general:
  debug: false

server:
  # Generate a real value: python -c "import secrets; print(secrets.token_hex(32))"
  secret_key: "CHANGE_ME_run_the_token_hex_command"
  bind_address: "127.0.0.1"
  port: 8888
  limiter: false
  public_instance: false    # keep false, or the limiter calls sys.exit(1)
  image_proxy: false

# Mode B only — the in-memory store (requires the memory:// patch and fakeredis[lua]).
# Leave commented for Mode A.
# valkey:
#   url: "memory://"

search:
  # Enable the JSON API Tommy calls (default ships html only).
  formats:
    - html
    - json

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
